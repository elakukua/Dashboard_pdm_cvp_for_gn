<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDM CVP for GN — Dashboard Monitoring</title>
<meta name="description" content="Dashboard monitoring post-distribution Cash & Voucher Programming (CVP) untuk Gift Notification (GN) Wahana Visi Indonesia">
<style>
/* =========================================================================
   PALET WARNA DASAR (DIPERTAHANKAN SESUAI ASLI)
   ========================================================================= */
:root{
  --o:#FF5515; --o-2:#FF8A4C; --o-3:#FFB38A; --o-4:#FFD9C2;
  --d:#111222; --d-2:#4A4A55; --d-3:#8C8C99; --d-4:#BFBFC7;
  --bg:#EDEDF1; --page:#F5F5F7; --card:#FFFFFF; --line:#E9E9EE; --grid:#F2F2F5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);
  font-family:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  color:var(--d);font-size:13px;-webkit-font-smoothing:antialiased;line-height:1.45}

/* ---------- custom scrollbar ---------- */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--d-4);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--d-3)}

/* ---------- main layout frame ---------- */
.frame{
  max-width:1440px;margin:20px auto;background:var(--page);border-radius:14px;
  box-shadow:0 2px 6px rgba(17,18,34,.04), 0 16px 36px rgba(17,18,34,.08);
  display:grid;grid-template-columns:172px 1fr;overflow:visible;min-height:840px;
  transition:grid-template-columns .28s cubic-bezier(0.16,1,0.3,1);
  position:relative;
}
.frame.collapsed{grid-template-columns:64px 1fr}

/* mobile header bar */
.mobile-bar{
  display:none;align-items:center;justify-content:space-between;
  padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:90;box-shadow:0 1px 3px rgba(17,18,34,.05);
}
.mobile-bar .mob-title{font-size:12px;font-weight:700;color:var(--d);letter-spacing:.2px}
.mob-btn{
  appearance:none;border:1px solid var(--line);background:var(--page);border-radius:6px;
  padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--d-2);transition:all .18s ease;
}
.mob-btn:hover{background:#FFF6F2;color:var(--o);border-color:var(--o-3)}
.mob-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* backdrop overlay for mobile drawer */
.sidebar-backdrop{
  position:fixed;inset:0;background:rgba(17,18,34,.35);backdrop-filter:blur(2px);
  z-index:95;opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.sidebar-backdrop.active{opacity:1;pointer-events:auto}

/* ---------- sidebar (<aside>) ---------- */
aside{
  background:var(--card);border-right:1px solid var(--line);padding:14px 0 18px;
  display:flex;flex-direction:column;position:sticky;top:12px;height:calc(100vh - 24px);overflow-y:auto;z-index:45;align-self:start;
  transition:width .28s cubic-bezier(0.16,1,0.3,1), transform .28s cubic-bezier(0.16,1,0.3,1);
}
@media(max-width:820px){
  aside{
    position:fixed;top:0;left:0;height:100vh;max-height:100vh;overflow-y:auto;
    z-index:96;transform:translateX(-100%);
  }
}
.aside-head{
  display:flex;align-items:center;justify-content:space-between;padding:2px 12px 16px;
  border-bottom:1px solid var(--line);margin-bottom:10px;
}
.toggle-btn{
  appearance:none;border:1px solid var(--line);background:var(--page);border-radius:7px;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--d-2);flex:0 0 auto;
  transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .2s ease;
}
.toggle-btn:hover{background:var(--pill-bg, #FFF6F2);border-color:var(--o-3);color:var(--o)}
.toggle-btn:active{transform:scale(.95)}
.toggle-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.aside-actions{display:flex;align-items:center;gap:6px;}
.frame.collapsed .aside-actions{display:none}
.theme-btn, .lang-btn{
  appearance:none;border:1px solid var(--line);background:var(--page);border-radius:7px;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--d-2);flex:0 0 auto;
  transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .2s ease;
}
.theme-btn:hover, .lang-btn:hover{background:var(--pill-bg, #FFF6F2);border-color:var(--o-3);color:var(--o)}
.theme-btn:active, .lang-btn:active{transform:scale(.95)}
.lang-btn.active-en{border-color:var(--o);color:var(--o);background:var(--pill-bg, #FFF6F2)}
.theme-btn svg, .lang-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mob-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.mob-btn.active-en{border-color:var(--o);color:var(--o);background:var(--pill-bg, #FFF6F2)}
.icon-sun{display:none}
.icon-moon{display:block}
body.dark .icon-sun{display:block}
body.dark .icon-moon{display:none}
.frame.collapsed .aside-head{justify-content:center;padding:2px 8px 16px}

aside nav{display:flex;flex-direction:column;gap:2px}
aside nav button{
  appearance:none;border:0;background:none;font:inherit;font-size:11.5px;
  color:var(--d-3);text-align:left;padding:9px 12px 9px 16px;cursor:pointer;
  border-left:3px solid transparent;line-height:1.35;
  display:flex;align-items:center;gap:9px;white-space:nowrap;
  transition:color .18s ease,background-color .18s ease,border-left-color .18s ease,transform .18s ease;
  position:relative;
}
aside nav button:hover{color:var(--d);background:var(--page);transform:translateX(2px)}
aside nav button[aria-current="true"]{
  color:var(--o);font-weight:600;border-left-color:var(--o);
  background:#FFF6F2;transform:none;
}
aside nav button:focus-visible{outline:2px solid var(--o);outline-offset:-2px}
aside nav button svg{
  flex:0 0 auto;width:14px;height:14px;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .18s ease;
}
aside nav button:hover svg{transform:scale(1.1)}
aside nav button span{
  transition:opacity .2s ease,transform .2s ease,max-width .25s ease;
  overflow:hidden;text-overflow:ellipsis;
}
.frame.collapsed aside nav button{
  padding:10px 0;justify-content:center;border-left-width:0;
  border-bottom:2px solid transparent;
}
.frame.collapsed aside nav button[aria-current="true"]{
  border-left-color:transparent;border-bottom-color:var(--o);
}
.frame.collapsed aside nav button span{
  opacity:0;max-width:0;transform:translateX(-10px);pointer-events:none;
}
aside .by{
  margin-top:auto;padding:12px 16px 0;font-size:8.5px;color:var(--d-4);
  font-style:italic;line-height:1.5;transition:opacity .2s ease;
  border-top:1px solid var(--grid);
}
.frame.collapsed aside .by{opacity:0;pointer-events:none}

@media(max-width:820px){
  .mobile-bar{display:flex}
  .frame{grid-template-columns:1fr;margin:0;border-radius:0;box-shadow:none;min-height:auto}
  .frame.collapsed{grid-template-columns:1fr}
  aside{
    position:fixed;top:0;bottom:0;left:0;width:230px;box-shadow:4px 0 24px rgba(17,18,34,.16);
    transform:translateX(-100%);padding-top:18px;
  }
  aside.drawer-open{transform:translateX(0)}
  .frame.collapsed aside nav button span{opacity:1;max-width:none;transform:none;pointer-events:auto}
  .frame.collapsed aside nav button{justify-content:flex-start;padding:9px 12px 9px 16px;border-left-width:3px;border-bottom-width:0}
  .frame.collapsed aside .by{opacity:1}
}

/* ---------- main area ---------- */
main{padding:20px 24px 28px;min-width:0;display:flex;flex-direction:column}

/* cover */
.cover{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:12px;margin-bottom:11px;min-height:700px;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:60px;overflow:hidden;
  box-shadow:0 2px 10px rgba(17,18,34,.04);
  transition:background-color .25s ease,border-color .25s ease,box-shadow .25s ease;
}
.cv-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.cv-bg .solid{
  position:absolute;top:-25%;right:-10%;width:760px;height:760px;
  background:radial-gradient(circle, rgba(255,85,21,0.18) 0%, rgba(255,138,76,0.06) 50%, transparent 75%);
  border-radius:50%;
}
.cv-bg .ring{position:absolute;border-radius:50%;border:1px solid rgba(17,18,34,0.06)}
.cv-bg .ring.r1{top:-30%;right:-15%;width:900px;height:900px}
.cv-bg .ring.r2{top:-35%;right:-20%;width:1040px;height:1040px}
.cv-bg .ring.r3{top:-40%;right:-25%;width:1180px;height:1180px}

/* Logo WVI di sudut kanan atas cover — dua varian, otomatis ikut tema */
.cv-logo-wrapper{
  position:absolute;top:44px;right:48px;z-index:20;
  width:210px;
}
.cv-logo-img{width:100%;height:auto;display:block}
.cv-logo-img.mono{display:none}
body.dark .cv-logo-img.mono{display:block}
body.dark .cv-logo-img.dark{display:none}

.cv-main{position:relative;z-index:10;max-width:700px;padding:0}
.cv-main .eyebrow{font-size:12px;font-weight:700;letter-spacing:3px;color:var(--d-2);text-transform:uppercase}
.cv-main .rule{width:45px;height:4px;background:var(--o);margin:16px 0 24px;border-radius:2px}
.cv-main h2{margin:0;font-size:46px;line-height:1.15;font-weight:700;letter-spacing:-1px;color:var(--d)}
.cv-main .prog{margin:24px 0 0;font-size:14px;color:var(--d-2)}

@media(max-width:820px){
  .cover{min-height:480px;padding:34px 24px}
  .cv-main h2{font-size:30px}
  .cv-bg .solid{top:-20%;right:-30%;width:480px;height:480px}
  .cv-bg .ring{display:none}
  .cv-logo-wrapper{top:20px;right:20px;width:150px}
}

/* filter panel dropdown */
.fbar{
  position:sticky;top:10px;z-index:50;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 14px;margin-bottom:14px;
  box-shadow:0 4px 18px -2px rgba(17,18,34,.08);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:padding .22s cubic-bezier(0.16,1,0.3,1),
             margin-bottom .22s cubic-bezier(0.16,1,0.3,1),
             box-shadow .25s ease,
             border-color .25s ease,
             background-color .25s ease;
}
body.dark .fbar{
  box-shadow:0 4px 20px -2px rgba(0,0,0,.45);
}
@media(max-width:820px){
  .fbar{
    top:52px;z-index:85;
  }
}
.fbar[hidden]{display:none}

/* Sticky Compact Filter Bar when scrolled > 200px */
.fbar.compact{
  padding:5px 12px;
  margin-bottom:10px;
  box-shadow:0 8px 24px -4px rgba(17,18,34,.14);
  border-color:rgba(255,80,0,0.35);
}
body.dark .fbar.compact{
  box-shadow:0 8px 26px -4px rgba(0,0,0,.6);
  border-color:rgba(255,80,0,0.45);
}
@media(max-width:820px){
  .fbar.compact{
    top:50px;
    padding:4px 10px;
  }
}
.fbar.compact .fhead{margin-bottom:3px}
.fbar.compact .fhead h4{font-size:9px;letter-spacing:1px}
.fbar.compact .fstat{font-size:9px}
.fbar.compact .fhead-actions{gap:5px}
.fbar.compact .f-act-btn{padding:2.5px 7px;font-size:9px;border-radius:5px}
.fbar.compact .f-act-btn svg{width:11px;height:11px}
.fbar.compact .slicers{gap:6px}
.fbar.compact .sl-btn{padding:3px 8px;border-radius:6px}
.fbar.compact .sl-btn .lbl{font-size:7.5px;letter-spacing:.6px;line-height:1;margin-bottom:0}
.fbar.compact .sl-btn .val{font-size:10px;line-height:1.2;margin-top:1px}
.fbar.compact .sl-btn .car{margin-top:2px}
.fbar.compact .freset{padding:2.5px 7px;font-size:9px}
.fbar .fhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.fhead-left{display:flex;align-items:center;gap:10px}
.fbar .fhead h4{margin:0;font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--d-2)}
.fstat{font-size:10px;color:var(--d-2);font-variant-numeric:tabular-nums}
.fstat b{color:var(--o)}
.fhead-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.f-act-btn{
  appearance:none;border:1px solid var(--line);background:var(--page);border-radius:6px;
  font:inherit;font-size:9.5px;font-weight:600;color:var(--d-2);padding:4px 9px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;line-height:1.2;
  transition:all .18s ease;
}
.f-act-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.f-act-btn:hover{border-color:var(--o);color:var(--o);background:var(--pill-bg, #FFF6F2)}
.f-act-btn.primary{
  border-color:var(--o-3);
  background:var(--pill-bg, #FFF6F2);
  color:var(--o);
  font-weight:700;
}
.f-act-btn.primary:hover{
  background:var(--o);
  color:#fff;
  border-color:var(--o);
}
body.dark .f-act-btn.primary{
  background:rgba(255,80,0,0.14);
  border-color:rgba(255,80,0,0.35);
  color:#ff7a33;
}
body.dark .f-act-btn.primary:hover{
  background:var(--o);
  color:#fff;
}
.freset{
  appearance:none;border:1px solid var(--line);background:var(--page);border-radius:6px;
  font:inherit;font-size:9.5px;font-weight:600;color:var(--d-2);padding:4px 10px;cursor:pointer;
  transition:all .18s ease;
}
.freset:hover{border-color:var(--o);color:var(--o);background:var(--pill-bg, #FFF6F2)}
.freset[hidden]{display:none}
.slicers{display:grid;grid-template-columns:1.15fr 1.15fr .7fr;gap:9px}
@media(max-width:980px){.slicers{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.slicers{grid-template-columns:1fr}}

/* dropdown search & quick actions */
.sl-search-wrap{
  padding:6px 8px;border-bottom:1px solid var(--grid);display:flex;align-items:center;gap:6px;
  background:var(--card);
}
.sl-search-wrap svg{width:12px;height:12px;stroke:var(--d-3);fill:none;stroke-width:2;flex:0 0 auto}
.sl-search-inp{
  width:100%;border:none;background:transparent;font:inherit;font-size:10px;color:var(--d);
  outline:none;padding:0;
}
.sl-search-inp::placeholder{color:var(--d-4)}
.sl-quick-actions{
  display:flex;align-items:center;justify-content:space-between;padding:4px 10px 5px;
  font-size:9px;border-bottom:1px solid var(--grid);background:var(--page);color:var(--d-3);
}
.sl-act-link{
  appearance:none;border:none;background:none;font:inherit;font-size:9px;font-weight:600;
  color:var(--d-2);cursor:pointer;padding:0;
}
.sl-act-link:hover{color:var(--o);text-decoration:underline}

/* dropdown head */
.sl{position:relative;min-width:0}
.sl-btn{
  appearance:none;width:100%;display:flex;align-items:center;gap:8px;font:inherit;
  border:1px solid var(--line);border-radius:8px;background:var(--page);
  padding:6px 10px;cursor:pointer;text-align:left;min-width:0;
  transition:border-color .18s ease,background-color .18s ease,box-shadow .18s ease;
}
.sl-btn:hover{border-color:var(--o-3);background:var(--card)}
.sl.open .sl-btn{background:var(--card);border-color:var(--o);box-shadow:0 0 0 2px #FFE7DB}
.sl-btn:focus-visible{outline:2px solid var(--o);outline-offset:1px}
.sl-btn .txt{flex:1;min-width:0}
.sl-btn .lbl{display:block;font-size:8.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--d-3);line-height:1.2}
.sl-btn .val{display:block;margin-top:2px;font-size:11px;font-weight:600;color:var(--d);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-btn .val.off{color:var(--d-3);font-weight:500}
.sl-btn .car{flex:0 0 auto;width:0;height:0;margin-top:4px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--d-3);transition:transform .2s ease}
.sl.open .sl-btn .car{transform:rotate(180deg);border-top-color:var(--o)}

/* dropdown popup */
.sl-pop{
  position:absolute;z-index:40;top:calc(100% + 4px);left:0;right:0;
  background:var(--card);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 12px 28px rgba(17,18,34,.16);overflow:hidden;
  opacity:0;visibility:hidden;transform:translateY(-6px) scaleY(.96);transform-origin:top;
  transition:opacity .18s ease,transform .18s ease,visibility .18s;
}
.sl.open .sl-pop{opacity:1;visibility:visible;transform:translateY(0) scaleY(1)}
.sl-list{max-height:200px;overflow-y:auto;padding:5px 0}
.sl-i{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:10.5px;color:var(--d-2);cursor:pointer;line-height:1.4;transition:background-color .12s ease}
.sl-i:hover{background:#FFF6F2}
.sl-i input{appearance:none;flex:0 0 auto;width:12px;height:12px;margin:0;border-radius:2px;border:1px solid var(--d-4);background:var(--card);cursor:pointer;position:relative}
.sl-i input:checked{background:var(--o);border-color:var(--o)}
.sl-i input:checked::after{content:"";position:absolute;left:3px;top:.5px;width:4px;height:7px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(42deg)}
.sl-i input:focus-visible{outline:2px solid var(--o);outline-offset:1px}
.sl-i span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-i b{font-size:9.5px;font-weight:600;color:var(--d-4);font-variant-numeric:tabular-nums}
.sl-i.sel{color:var(--o);font-weight:600}
.sl-i.sel b{color:var(--o-2)}
.sl-i.dis{opacity:.38;cursor:default}
.sl-all{border-bottom:1px solid var(--grid);margin-bottom:3px;padding-bottom:6px;font-size:10px;color:var(--d-3)}
.sl-all.sel{color:var(--o)}

.top{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.2px}
.top .sub{font-size:9.5px;color:var(--d-3);font-style:italic;margin-top:2px}

/* parameters / KPI */
.params{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:11px}
@media(max-width:1100px){.params{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.params{grid-template-columns:repeat(2,1fr)}}
.params.p4{grid-template-columns:repeat(4,1fr)}
.pm{
  background:var(--page);border:1px solid var(--line);border-radius:9px;
  padding:10px 11px 14px;text-align:center;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.pm:hover{transform:translateY(-1.5px);box-shadow:0 4px 12px rgba(17,18,34,.05);border-color:var(--o-4)}
.pm .tab{
  background:var(--card);border:1px solid var(--line);border-radius:6px;
  font-size:10px;font-weight:600;color:var(--d-2);padding:5px 6px;margin-bottom:9px;line-height:1.25;
}
.pm .big{font-size:29px;font-weight:700;line-height:1.05;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.pm .big.sm{font-size:19px}
.pm .big .u{font-size:15px;color:var(--d-3);font-weight:700}
.pm .base{font-size:8.5px;color:var(--d-3);margin-top:5px;line-height:1.35}

/* row grids */
.row{display:grid;gap:9px;margin-bottom:9px}
.r-1{grid-template-columns:1fr}
.r-2{grid-template-columns:1fr 1fr}
.r-3{grid-template-columns:1fr 1fr 1fr}
.r-21{grid-template-columns:1.62fr 1fr}
.r-12{grid-template-columns:1fr 1.62fr}
@media(max-width:1100px){.r-2,.r-3,.r-21,.r-12{grid-template-columns:1fr}}

/* card container */
.c{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:16px;position:relative;min-width:0;display:flex;flex-direction:column;height:100%;
  box-shadow:0 1px 4px rgba(17,18,34,.03);
  transition:box-shadow .2s ease,border-color .2s ease;
}
.c:hover{box-shadow:0 6px 18px -2px rgba(17,18,34,.06);border-color:#DFDFE7}
.c h3{margin:0;font-size:12.5px;font-weight:600;line-height:1.3;padding-right:70px;flex:0 0 auto}
.c .st{font-size:9px;color:var(--d-3);font-style:italic;margin:2px 0 12px;flex:0 0 auto}
.c>.hb{flex:1;align-content:space-between}
.c>.dn{flex:1}
.c>.fnl{flex:1;justify-content:space-between}
.c>.vb{flex:1;min-height:0}
.c>table{flex:0 0 auto}
.c>.sw{flex:0 0 auto}
.tbl-tag{position:absolute;top:12px;right:12px;background:#FFF1EA;color:#B03D06;border-radius:4px;padding:2px 6px;font-size:8.5px;font-weight:700;letter-spacing:.3px}

/* horizontal bar charts */
.hb{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:center}
.hb.tight{gap:4px 10px}
.hb .k{font-size:10.5px;color:var(--d-2);text-align:right;line-height:1.25}
.hb .b{position:relative;height:17px;display:flex;align-items:center}
.hb .b i{display:block;height:17px;border-radius:3px;background:var(--o);min-width:2px;transition:width .35s cubic-bezier(0.16,1,0.3,1)}
.hb .b i.g{background:var(--d-4)} .hb .b i.dk{background:var(--d)}
.hb .b i.l{background:var(--o-3)} .hb .b i.ll{background:var(--o-4)}
.hb .b span{font-size:10px;font-weight:600;margin-left:7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hb .b span em{font-style:normal;font-weight:400;color:var(--d-3);font-size:9px}

/* funnel */
.fnl{display:flex;flex-direction:column;gap:6px}
.fnl .s{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.fnl .bar{height:28px;border-radius:4px;background:var(--o);display:flex;align-items:center;padding-left:10px;color:#fff;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;transition:width .35s ease}
.fnl .bar.f2{background:var(--o-2)} .fnl .bar.f3{background:var(--o-3);color:var(--d)}
.fnl .bar.f4{background:var(--o-4);color:var(--d)}
.fnl .n{font-size:10px;color:var(--d-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.fnl .n em{font-style:normal;color:var(--d-4);font-size:9px}

/* donut */
.dn{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dn .ring{width:126px;height:126px;border-radius:50%;flex:0 0 auto;position:relative;display:grid;place-items:center}
.dn .ring::after{content:"";position:absolute;inset:22px;background:var(--card);border-radius:50%}
.dn .ctr{position:relative;z-index:1;text-align:center}
.dn .ctr b{display:block;font-size:19px;font-weight:700;line-height:1}
.dn .ctr small{font-size:8.5px;color:var(--d-3)}
.dn ul{list-style:none;margin:0;padding:0;font-size:10.5px;min-width:150px;flex:1}
.dn li{display:flex;align-items:center;gap:7px;padding:3px 0;color:var(--d-2)}
.dn li i{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.dn li b{margin-left:auto;font-variant-numeric:tabular-nums}
.dn li em{font-style:normal;color:var(--d-3);font-size:9.5px;margin-left:3px}

/* table */
table{width:100%;border-collapse:collapse;font-size:10.5px}
th{text-align:left;font-size:9px;font-weight:600;color:var(--d-3);padding:0 6px 7px;border-bottom:1px solid var(--line);line-height:1.3;vertical-align:bottom}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
th.ctr,td.ctr{text-align:center;font-variant-numeric:tabular-nums}
td{padding:6px 6px;border-bottom:1px solid var(--grid);vertical-align:middle;transition:background-color .15s ease}
tbody tr:hover td{background-color:rgba(255,85,21,.035)}
tbody tr:last-child td{border-bottom:0}
td em{font-style:normal;color:var(--d-3)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:600}
.pill.d{background:#EFEFF3;color:var(--d-2)}
.heat td.h{text-align:center;font-weight:600;font-size:9.5px;border-radius:3px;font-variant-numeric:tabular-nums}
.rng{position:relative;display:block;height:13px;background:var(--grid);border-radius:3px;min-width:60px}
.rng i{position:absolute;top:0;bottom:0;background:var(--o-3);border-radius:3px}
.rng u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--o);text-decoration:none}
.vb{list-style:none;margin:0;padding:0;max-height:232px;overflow-y:auto}
.vb li{font-size:10px;color:var(--d-2);line-height:1.5;padding:6px 2px 6px 10px;border-left:2px solid var(--o-4);border-bottom:1px solid var(--grid);transition:background-color .15s ease}
.vb li:hover{background-color:rgba(255,85,21,.025)}
.vb li:last-child{border-bottom:0}
.sw{display:flex;gap:14px;flex-wrap:wrap;font-size:9px;color:var(--d-3);margin:-4px 0 9px}
.sw span i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}
.dq{display:inline-block;background:#FFF1EA;color:#B03D06;border-radius:3px;padding:1px 5px;font-size:8.5px;font-weight:700;letter-spacing:.2px}
.note{background:#FFF6F2;border:1px solid #FFE0D0;border-radius:9px;padding:11px 14px;font-size:10px;color:#8A3A0E;line-height:1.6;margin-bottom:11px}
.note b{color:#6B2A05}
.empty{background:var(--card);border:1px dashed var(--d-4);border-radius:10px;padding:34px 20px;text-align:center;font-size:11px;color:var(--d-3);line-height:1.7}
.pg{display:none} .pg.on{display:block;animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* cover filling height */
#pages{flex:1;display:flex;flex-direction:column}
#pages>.pg-cover.on{flex:1}
.pg.pg-cover .cover{margin-bottom:0}

/* =========================================================================
   PATCH CSS — Halaman "Demografi"
   ========================================================================= */
.cv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:9px}
.cv-grid.g3{grid-template-columns:repeat(3,1fr)}
.cv-grid>.c{height:100%}
.cv-grid>.c.sp2{grid-column:1/-1}
@media(max-width:1100px){.cv-grid,.cv-grid.g3{grid-template-columns:1fr}}

.dgs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 10px;flex:0 0 auto}
.dgs>div{flex:1 1 0;min-width:88px;background:var(--page);border:1px solid var(--line);border-radius:8px;padding:8px 10px;transition:border-color .18s ease}
.dgs>div:hover{border-color:var(--o-3)}
.dgs b{display:block;font-size:20px;font-weight:700;line-height:1.05;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.dgs b .u{font-size:11px;color:var(--d-3)}
.dgs small{display:block;margin-top:3px;font-size:8.5px;color:var(--d-3);line-height:1.35}

/* =========================================================================
   MODE GELAP / DARK THEME SYSTEM & CETAK LAPORAN
   ========================================================================= */

  --d:#F3F4F8; --d-2:#B0B3C6; --d-3:#7C7E96; --d-4:#43455B;

/* Print optimizations */
/* ---------- Bilingual Official Print Letterhead & Print Styles ---------- */
.print-letterhead{display:none}

@media print{
  @page{
    margin:10mm 12mm;
    size:A4 portrait;
  }
  body{
    background:#ffffff!important;
    color:#111222!important;
    font-size:11.5px!important;
  }
  .mobile-bar, aside, .fbar, .sidebar-backdrop, .toggle-btn, .theme-btn, .lang-btn{display:none!important}
  .frame{
    box-shadow:none!important;margin:0!important;max-width:100%!important;border-radius:0!important;
    display:block!important;border:none!important;background:#ffffff!important;
  }
  main{padding:0!important;margin:0!important}
  
  /* Single page print default */
  .pg{display:none!important}
  .pg.on{display:block!important}

  /* Full multi-page dossier print */
  body.print-all-pages .pg{
    display:block!important;
    page-break-before:always!important;
    break-before:page!important;
    margin-bottom:0!important;
    padding-top:10px!important;
  }
  body.print-all-pages .pg#p0,
  body.print-all-pages .pg:first-of-type{
    page-break-before:avoid!important;
    break-before:avoid!important;
    padding-top:0!important;
  }

  /* Section top header in print */
  .top{
    display:flex!important;
    flex-direction:column!important;
    border-bottom:2px solid #FF5000!important;
    padding-bottom:5px!important;
    margin-bottom:12px!important;
    break-inside:avoid;
    page-break-inside:avoid;
  }
  .top h1{
    font-size:16px!important;
    font-weight:800!important;
    color:#0f172a!important;
    margin:0 0 2px!important;
  }
  .top .sub{
    font-size:9.5px!important;
    color:#475569!important;
  }

  .c{
    box-shadow:none!important;border:1px solid #cbd5e1!important;
    break-inside:avoid;page-break-inside:avoid;margin-bottom:12px!important;
    background:#ffffff!important;
  }

  /* Cover print */
  .cover{
    min-height:92vh!important;
    page-break-after:always!important;
    break-after:page!important;
    box-shadow:none!important;
    border:2px solid #FF5000!important;
    background:#ffffff!important;
    color:#111222!important;
    padding:40px 30px!important;
  }
  .cover .prog{
    color:#334155!important;
  }

  /* Table and rows page break behavior */
  table{width:100%!important;border-collapse:collapse!important}
  thead{display:table-header-group!important}
  tr{break-inside:avoid;page-break-inside:avoid}
  
  /* Kop Laporan Resmi Wahana Visi Indonesia */
  .print-letterhead{
    display:block!important;
    margin-bottom:18px!important;
    page-break-inside:avoid;break-inside:avoid;
  }
  .pl-kop{
    display:flex!important;align-items:center!important;gap:18px!important;margin-bottom:10px!important;
  }
  .pl-logo-col{flex:0 0 150px!important}
  .pl-logo{width:150px!important;height:auto!important;display:block!important}
  /* cetak selalu di kertas putih: paksa varian navy walau dashboard sedang dark mode */
  .cv-logo-img.mono{display:none!important}
  .cv-logo-img.dark{display:block!important}
  .cv-logo-wrapper{top:30px!important;right:30px!important;width:170px!important}
  .pl-title-col{flex:1 1 auto!important}
  .pl-org{
    font-size:14px!important;font-weight:800!important;letter-spacing:0.6px!important;
    color:#111222!important;line-height:1.2!important;
  }
  .pl-org-sub{
    font-size:9px!important;color:#64748b!important;margin-bottom:3px!important;
  }
  .pl-doc-title{
    font-size:12.5px!important;font-weight:800!important;color:#FF5000!important;
    letter-spacing:0.3px!important;line-height:1.2!important;
  }
  .pl-doc-sub{
    font-size:9.5px!important;font-weight:600!important;color:#334155!important;
  }
  .pl-divider{
    height:3px!important;background:#FF5000!important;border-bottom:1px solid #111222!important;
    margin:8px 0 12px!important;
  }
  .pl-meta-grid{
    display:grid!important;grid-template-columns:1.2fr 0.8fr!important;gap:6px 14px!important;
    background:#f8fafc!important;border:1px solid #e2e8f0!important;border-radius:6px!important;
    padding:8px 12px!important;font-size:9.5px!important;color:#111222!important;
    -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;
  }
  .pl-meta-item{display:flex!important;flex-direction:column!important;gap:2px!important}
  .pl-lbl{
    font-size:8px!important;font-weight:700!important;letter-spacing:0.8px!important;
    color:#64748b!important;text-transform:uppercase!important;
  }
  .pl-val{font-size:9.5px!important;color:#0f172a!important;line-height:1.3!important}

  /* Preserve exact colors for bars, charts and tags */
  .b i, .bar, .pill, .ring, .tbl-tag{
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
  }
}

function tr(s){
  if(currentLang !== 'en' || !s || typeof s !== 'string') return s;
  if(EN_DICT[s]) return EN_DICT[s];
  const t = s.trim();
  if(EN_DICT[t]) return EN_DICT[t];

  // Dynamic regex replacements for recurring patterns
  let res = s;
  res = res.replace(/\bRC terwawancara pada seleksi ini\b/g, 'RCs interviewed in this selection');
  res = res.replace(/\bAP dalam seleksi\b/g, 'PAs in selection');
  res = res.replace(/\bterwawancara\b/g, 'interviewed');
  res = res.replace(/\brentang\b/g, 'range');
  res = res.replace(/\bskala 1–5\b/g, 'scale 1–5');
  res = res.replace(/\bskala 1\u20135\b/g, 'scale 1–5');
  res = res.replace(/\bdari (\d+) RC\b/g, 'of $1 RCs');
  res = res.replace(/\bdari (\d+) anak\b/g, 'of $1 children');
  res = res.replace(/\bSatu indikator per area, disebut eksplisit\b/g, 'One benchmark indicator per area');
  res = res.replace(/\bJumlah RC terwawancara\b/g, 'Number of interviewed RCs');
  res = res.replace(/\bRentang terendah–tertinggi\b/g, 'Min–max range');
  res = res.replace(/\bgaris oranye = median\b/g, 'orange marker = median');
  res = res.replace(/\brentang min–max\b/g, 'min–max range');
  res = res.replace(/\bJawaban terbuka · (\d+) dari (\d+) RC memberi isi\b/g, 'Open-ended feedback · $1 of $2 RCs responded');
  res = res.replace(/\bJawaban terbuka · (\d+) dari (\d+) RC menyampaikan usulan\b/g, 'Open-ended feedback · $1 of $2 RCs made suggestions');
  res = res.replace(/\bJawaban terbuka\b/g, 'Open-ended feedback');
  res = res.replace(/\bBasis (\d+) RC\b/g, 'Base of $1 RCs');
  res = res.replace(/\bbasis (\d+) RC\b/g, 'base of $1 RCs');
  res = res.replace(/\bMulti-respons · basis (\d+) RC\b/g, 'Multiple responses · base $1 RCs');
  res = res.replace(/\bPilihan tunggal · basis (\d+) RC\b/g, 'Single choice · base $1 RCs');
  res = res.replace(/\bPertanyaan sensitif · basis (\d+) RC\b/g, 'Sensitive question · base $1 RCs');
  res = res.replace(/\bPersepsi RC · basis (\d+) RC\b/g, 'RC perception · base $1 RCs');
  res = res.replace(/\bSkala 1–5 · basis (\d+) RC\b/g, 'Scale 1–5 · base $1 RCs');
  res = res.replace(/\bSkala 1\u20135 · basis (\d+) RC\b/g, 'Scale 1–5 · base $1 RCs');
  res = res.replace(/\bJumlah RC · multi-respons\b/g, 'Number of RCs · multiple responses');
  res = res.replace(/\bJumlah RC · basis (\d+) RC\b/g, 'Number of RCs · base $1 RCs');
  res = res.replace(/\btanpa jawaban\b/g, 'unanswered');
  res = res.replace(/\bth\b/g, 'yo');
  res = res.replace(/\borang\b/g, 'people');
  res = res.replace(/\banak\b/g, 'children');

  return res;
}

const dec = (n,d=1) => Number(n).toFixed(d).replace('.',',');
function rp(v){
  if(v==null) return '—';
  if(currentLang === 'en'){
    if(v>=1e6) return 'IDR '+dec(v/1e6,2)+'M';
    if(v>=1e3) return 'IDR '+nf(Math.round(v/1e3))+'k';
    return 'IDR '+nf(v);
  }
  if(v>=1e6) return 'Rp '+dec(v/1e6,2)+' jt';
  if(v>=1e3) return 'Rp '+nf(Math.round(v/1e3))+' rb';
  return 'Rp '+nf(v);

function med(a){a=a.slice().sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;
  return a.length%2?a[m]:(a[m-1]+a[m])/2;}

function dist(rows,key,order){
  const m={}; rows.forEach(r=>{const v=r[key]; if(v) m[v]=(m[v]||0)+1;});
  const ks = order? order.filter(k=>k in m || true) : Object.keys(m).sort((a,b)=>m[b]-m[a]);
  return ks.map(k=>({k:k,v:m[k]||0}));
}
function multi(rows,key,labels){
  const out = labels.map(l=>({k:l,v:rows.filter(r=>(r[key]||[]).indexOf(l)>=0).length}));

function byAp(rows){
  const m=new Map();
  rows.forEach(r=>{ if(!m.has(r.ap)) m.set(r.ap,[]); m.get(r.ap).push(r); });
  return [...m.entries()].sort((a,b)=>b[1].length-a[1].length || a[0].localeCompare(b[0]));
}
function hb(items,opt){
  opt=opt||{};
  const mx = opt.max || Math.max(1,...items.map(i=>i.v));
  return '<div class="hb'+(opt.tight?' tight':'')+'">'+items.map(i=>{
    const zero = i.v===0;
    const w = zero?1:Math.max(1.5,i.v/mx*100);
    const cls = zero?'g':(i.cls||'');
    const rawLbl = i.lbl!=null ? i.lbl
      : (opt.max ? i.v+' <em>('+dec(i.v/opt.max*100,1)+'%)</em>' : i.v);
    const lbl = tr(String(rawLbl));
    const k = tr(i.k);
    return '<div class="k">'+k+'</div><div class="b"><i class="'+cls+'" style="width:'+
      w.toFixed(1)+'%"></i><span>'+lbl+'</span></div>';
  }).join('')+'</div>';
}
function funnel(items){
  const f=['','f2','f2','f3','f4'];
  return '<div class="fnl">'+items.map((i,ix)=>{
    const w=Math.max(6,i.w);
    const p=(i.pct!=null?i.pct:i.w);
    const num=i.n+(p!=null? ' <em>('+dec(p,1)+'%)</em>':'');
    return '<div class="s"><div class="bar '+(i.cls||f[Math.min(ix,4)])+'" style="width:'+
      w.toFixed(1)+'%">'+tr(i.k)+' &nbsp;·&nbsp; '+tr(i.v)+'</div><div class="n">'+num+'</div></div>';
  }).join('')+'</div>';
}

function donut(a,b,la,lb,ctrLabel){
  const t=a+b, pa=t?a/t*100:0;

    pa.toFixed(1)+'%,var(--d-4) '+pa.toFixed(1)+'% 100%)"><div class="ctr"><b>'+a+
    '</b><small>'+tr(ctrLabel)+'</small></div></div><ul><li><i style="background:var(--o)"></i>'+
    tr(la)+' <b>'+a+'</b></li><li><i style="background:var(--d-4)"></i>'+tr(lb)+' <b>'+b+'</b></li></ul></div>';

function verbatim(rows,key){
  const seen=new Map();
  rows.forEach(r=>{
    const t=(r[key]||'').trim();
    if(!t || NOSUG.test(t)) return;
    const k=t.toLowerCase();
    seen.set(k,{t:t,n:(seen.get(k)?seen.get(k).n+1:1)});
  });
  const list=[...seen.values()];
  if(!list.length) return '<div class="empty" style="padding:20px">Tidak ada jawaban berisi usulan pada seleksi ini.</div>';
  return '<ul class="vb">'+list.map(x=>'<li>'+esc(x.t)+
    (x.n>1?' <span class="pill d">'+x.n+'× identik</span>':'')+'</li>').join('')+'</ul>';
}

    const p=C(rr,r=>r.jkAnak==='Perempuan');
    const u=rr.map(r=>r.usiaAnak).filter(v=>v!=null);
    const g=rr.map(r=>r.anggota).filter(v=>v!=null);
    return '<tr><td>'+esc(a)+'</td>'+
      '<td class="n">'+nn+'</td>'+
      '<td class="n">'+p+'</td>'+
      '<td class="n">'+(nn-p)+'</td>'+
      '<td class="n">'+(u.length?dec(med(u),1):'\u2014')+'</td>'+
      '<td class="n">'+C(rr,r=>r.pendKk==='Tidak/belum sekolah'||r.pendKk==='SD')+'</td>'+
      '<td class="n">'+C(rr,r=>r.rumah==='Milik sendiri')+'</td>'+
      '<td class="n">'+C(rr,r=>r.disab==='Ya')+'</td>'+
      '<td class="n">'+(g.length?dec(avg(g),1):'\u2014')+'</td></tr>';
  }).join('');
  const apCard=card('Tabel A','Profil demografi per Area Program',
    'Angka absolut (n per AP kecil) \u00b7 median usia anak dan rata-rata anggota RT dalam desimal',
    tbl('<tr><th>Area Program</th><th class="n">RC</th><th class="n">Anak<br>P</th>'+
        '<th class="n">Anak<br>L</th><th class="n">Median usia<br>anak (th)</th>'+
        '<th class="n">KK \u2264 SD</th><th class="n">Rumah milik<br>sendiri</th>'+
        '<th class="n">RT<br>disabilitas</th><th class="n">Rata-rata<br>anggota RT</th></tr>',
        apBody),null);

  const dqBox = keDq ?
    '<div class="note"><b>Catatan kualitas data.</b> Kolom <i>jumlah anggota keluarga yang '+
    'berpenghasilan</i> tidak dipakai sebagai indikator pada halaman ini: <b>'+keDq+' dari '+n+
    ' record</b> mencatat jumlah berpenghasilan melebihi jumlah anggota usia &gt;18 tahun '+
    '(pola pengisian = total anggota RT). Rata-rata pada record yang lolos uji: '+
    (keOk.length?dec(avg(keOk),1):'\u2014')+' orang (basis '+keOk.length+' RC). '+
    'Perlu verifikasi lapangan sebelum dilaporkan.</div>' : '';

  return K + '<div class="cv-grid">'+G.join('')+'</div>' + row('r-1',[apCard]) + dqBox;
}

function pg1(R){
  const n=R.length, aps=byAp(R);
  const dOk=R.filter(r=>r.danaOk).map(r=>r.dana);
  const bad=C(R,r=>r.dana!=null && !r.danaOk);
  const kv5=R.map(r=>KEPVAL[r.kepuasan]).filter(x=>x);
  const mean = kv5.length? dec(kv5.reduce((a,b)=>a+b,0)/kv5.length,1) : '—';
  const info6all=C(R,r=>r.info6.every(Boolean));
  const kepFspPos=C(R,r=>r.kepFsp==='Puas'||r.kepFsp==='Sangat Puas');
  const danaSes=C(R,r=>r.danaSesuai==='Ya');
  const kemampuanPos=C(R,r=>r.kemampuan==='Semua'||r.kemampuan==='Sebagian besar');
  const kepPos=C(R,r=>r.kepuasan==='Puas'||r.kepuasan==='Sangat Puas');
  const mekAda=C(R,r=>r.mekAda==='Ya');

  const K=kpi([
    {t:'Responden (RC)',v:n,b:'RC terwawancara pada seleksi ini'},
    {t:'Area Program',v:new Set(R.map(r=>r.ap)).size,b:'AP dalam seleksi'},
    {t:'Nilai GN median',v:rp(med(dOk)),sm:true,
      b: dOk.length? 'rentang '+rp(Math.min(...dOk))+' – '+rp(Math.max(...dOk))+' · n='+dOk.length : 'tidak ada nilai valid'},
    {t:'Kepuasan program',v:mean+'<span class="u"> / 5</span>',b:'skala 1–5 · n='+kv5.length},
    {t:'Tahu mekanisme komplain',v:mekAda,b:'dari '+n+' RC'}
  ]);

  const areaBars=hb([
    {k:'Area 1 · Informasi lengkap 6/6 sub-item',v:info6all,lbl:pctS(info6all,n)+' <em>'+info6all+'/'+n+'</em>'},
    {k:'Area 2 · Puas/sangat puas pelayanan FSP',v:kepFspPos,lbl:pctS(kepFspPos,n)+' <em>'+kepFspPos+'/'+n+'</em>'},
    {k:'Area 3 · Dana diterima sesuai informasi',v:danaSes,lbl:pctS(danaSes,n)+' <em>'+danaSes+'/'+n+'</em>'},
    {k:'Area 4 · Kebutuhan dasar terpenuhi semua/sebagian besar',v:kemampuanPos,lbl:pctS(kemampuanPos,n)+' <em>'+kemampuanPos+'/'+n+'</em>'},
    {k:'Area 5 · Puas/sangat puas program GN',v:kepPos,lbl:pctS(kepPos,n)+' <em>'+kepPos+'/'+n+'</em>'},
    {k:'Area 6 · Tahu mekanisme feedback/komplain',v:mekAda,lbl:pctS(mekAda,n)+' <em>'+mekAda+'/'+n+'</em>'}
  ],{max:n});

  const ua=R.map(r=>r.usiaAnak).filter(x=>x!=null);
  const ag=R.map(r=>r.anggota).filter(x=>x!=null);
  const profil=kv([
    ['Usia anak penerima', ua.length? 'median '+med(ua)+' th <em>('+Math.min(...ua)+'–'+Math.max(...ua)+')</em>':'—'],
    ['Anak perempuan', C(R,r=>r.jkAnak==='Perempuan')+' / '+n],
    ['Responden perempuan', C(R,r=>r.jkResp==='Perempuan')+' / '+n],
    ['Responden adalah kepala keluarga', C(R,r=>r.isKk==='Ya')+' / '+n],
    ['Kepala keluarga perempuan', C(R,r=>r.jkKk==='Perempuan')+' / '+n],
    ['Pendidikan KK sampai SD', C(R,r=>r.pendKk==='SD'||r.pendKk==='Tidak/belum sekolah')+' / '+n],
    ['Ada anggota keluarga disabilitas', C(R,r=>r.disab==='Ya')+' / '+n],
    ['Rumah milik sendiri', C(R,r=>r.rumah==='Milik sendiri')+' / '+n],
    ['Pernah terima GN modalitas lama', C(R,r=>r.lama==='Ya')+' / '+n],
    ['Jumlah anggota keluarga', ag.length? 'median '+med(ag)+' <em>('+Math.min(...ag)+'–'+Math.max(...ag)+')</em>':'—']
  ]);

  const apBars=hb(aps.map(([a,rr])=>({k:esc(a),v:rr.length})),{tight:true});
  const SC=2800000;
  const rngRows=[['<b>Nasional</b>',dOk]].concat(aps.map(([a,rr])=>
    [esc(a), rr.filter(r=>r.danaOk).map(r=>r.dana)]))
    .map(([lbl,vals])=>{
      if(!vals.length) return '<tr><td>'+lbl+'</td><td>—</td><td class="n">—</td><td class="n">—</td><td class="n">—</td><td class="n">0</td></tr>';
      const mn=Math.min(...vals), mx=Math.max(...vals), m=med(vals);
      const left=mn/SC*100, w=Math.max(1.5,(mx-mn)/SC*100), mp=m/SC*100;
      return '<tr><td>'+lbl+'</td><td><span class="rng"><i style="left:'+left.toFixed(1)+
        '%;width:'+w.toFixed(1)+'%"></i><u style="left:'+mp.toFixed(1)+'%"></u></span></td>'+
        '<td class="n">'+rp(mn)+'</td><td class="n">'+rp(m)+'</td><td class="n">'+rp(mx)+
        '</td><td class="n">'+vals.length+'</td></tr>';
    }).join('');

  return K
  + row('r-21',[
      card('TABEL 1–11','Indikator penanda per area asesmen','Satu indikator per area, disebut eksplisit · basis '+n+' RC',areaBars),
      card('TABEL 16','Profil responden','Basis '+n+' RC · Household Survey Section A',profil)
    ])
  + row('r-2',[
      card('TABEL 15','Responden terdata per Area Program','Jumlah RC terwawancara · '+aps.length+' AP dalam seleksi',apBars),
      card('TABEL 6','Nilai GN yang diterima per AP','Rentang terendah–tertinggi · garis oranye = median',
        '<div class="sw"><span><i style="background:var(--o-3)"></i>rentang min–max</span><span><i style="background:var(--o)"></i>median</span></div>'
        + tbl('<tr><th>AP</th><th style="width:34%">Rentang (Rp 0 – 2,8 jt)</th><th class="n">Min</th><th class="n">Median</th><th class="n">Max</th><th class="n">n</th></tr>',rngRows))
    ])
  + row('r-2',[
      card('TABEL 13','"Apa yang menurut Anda PALING BAIK dari proses pemberian GN saat ini?"',
        'Jawaban terbuka · '+(n-noSugCount(R,'baik'))+' dari '+n+' RC memberi isi',verbatim(R,'baik')),
      card('TABEL 13','"Jika bisa mengubah SATU HAL dari proses pemberian GN, apa yang akan Anda ubah?"',
        'Jawaban terbuka · '+(n-noSugCount(R,'ubah'))+' dari '+n+' RC menyampaikan usulan',verbatim(R,'ubah'))
    ]);
}

function pg2(R){
  const n=R.length, aps=byAp(R);
  const cnt6=SUBLBL.map((_,ix)=>C(R,r=>r.info6[ix]));
  const all6=C(R,r=>r.info6.every(Boolean));
  const order=cnt6.map((v,ix)=>({v:v,ix:ix})).sort((a,b)=>b.v-a.v);
  const fn=order.map(o=>({k:SUBLBL[o.ix],v:o.v,n:o.v+'/'+n,w:n?o.v/n*100:0}))
    .concat([{k:'LENGKAP SEMUA 6 SUB-ITEM',v:all6,n:all6+'/'+n,w:n?all6/n*100:0,cls:'f4'}]);

  const heat=tbl('<tr><th>Area Program</th><th class="ctr">n RC</th>'+
      SUBSHORT.map(s=>'<th class="ctr">'+s+'</th>').join('')+'<th class="ctr">Lengkap<br>6/6</th></tr>',
    aps.map(([a,rr])=>{

          return '<td class="h" style="'+heatBg(v,m)+'">'+v+'</td>';}).join('')+

  const srcStaf=C(R,r=>r.srcStaf), srcKader=C(R,r=>r.srcKader);

    ['Tidak menyebut staf WVI di kedua pertanyaan', C(R,r=>!r.srcStaf&&!r.prefStaf)]

  const chTbl=tbl('<tr><th>Area Program</th><th class="ctr">n</th><th class="ctr">Staf WVI<br>aktual</th>'+
    '<th class="ctr">Staf<br>preferensi</th><th class="ctr">Kader/PJI<br>aktual</th>'+
    '<th class="ctr">Kader/PJI<br>preferensi</th><th class="ctr">Telp/SMS/WA<br>preferensi</th></tr>',
    aps.map(([a,rr])=>'<tr><td>'+esc(a)+'</td><td class="ctr">'+rr.length+'</td><td class="ctr">'+
      C(rr,r=>r.srcStaf)+'</td><td class="ctr">'+C(rr,r=>r.prefStaf)+'</td><td class="ctr">'+
      C(rr,r=>r.srcKader)+'</td><td class="ctr">'+C(rr,r=>r.prefKader)+'</td><td class="ctr">'+
      C(rr,r=>r.prefTelp)+'</td></tr>').join('')+
    '<tr><td><b>Total seleksi</b></td><td class="ctr"><b>'+n+'</b></td><td class="ctr"><b>'+srcStaf+
    '</b></td><td class="ctr"><b>'+pStaf+'</b></td><td class="ctr"><b>'+srcKader+
    '</b></td><td class="ctr"><b>'+pKader+'</b></td><td class="ctr"><b>'+pTelp+'</b></td></tr>');

  return kpi([
    {t:'Informasi lengkap 6/6 sub-item',v:all6,b:'dari '+n+' RC · '+pctS(all6,n)},
    {t:'Menjawab "informasi cukup: semua"',v:C(R,r=>r.infoCukup==='Ya, semua'),b:'dari '+n+' RC'},
    {t:'Menjawab "informasi cukup: terbatas"',v:C(R,r=>r.infoCukup==='Ya, terbatas'),
      b:'dari '+n+' RC · "tidak sama sekali": '+C(R,r=>r.infoCukup==='Tidak sama sekali')},
    {t:'Sumber informasi kader / PJI',v:srcKader,b:'dari '+n+' RC · multi-respons'}

      card('TABEL 1','Kelengkapan informasi per AP','Jumlah RC menerima 6/6 sub-item terhadap n tiap AP',
        hb(aps.map(([a,rr])=>({k:esc(a),v:C(rr,r=>r.info6.every(Boolean)),
          lbl:C(rr,r=>r.info6.every(Boolean))+' / '+rr.length})),
          {tight:true,max:Math.max(1,...aps.map(x=>x[1].length))}))
    ])

      'Jumlah RC menjawab Ya · sel oranye menandai jumlah di bawah n AP tersebut',heat)])
  + '<div class="note"><b>Catatan pembacaan dua pertanyaan channel.</b> "Sumber aktual" berasal dari pertanyaan <i>Darimana Anda mendapat informasi?</i> (menanyakan <b>siapa</b>), sedangkan "preferensi" berasal dari <i>Bagaimana sebaiknya Anda menerima informasi?</i> (menanyakan <b>lewat cara apa</b>). Opsi Kader/PJI pada preferensi berasal dari isian bebas yang telah direkode.</div>'
  + row('r-2',[
      card('TABEL 2','Sumber informasi yang diterima RC',
        'Multi-respons · basis '+n+' RC',
        hb([{k:'Kader perlindungan anak / PJI',v:srcKader,cls:'dk',lbl:of_(srcKader,n)},

      card('TABEL 2','Channel informasi yang disukai RC',
        'Multi-respons · basis '+n+' RC',
        hb([{k:'Langsung dari staf',v:pStaf,lbl:of_(pStaf,n)},

            {k:'Telepon / SMS / WhatsApp',v:pTelp,lbl:of_(pTelp,n)},
            {k:'Media sosial',v:pSos,lbl:of_(pSos,n)},
            {k:'Media cetak',v:pCetak,lbl:of_(pCetak,n)}],{max:n}))
    ])
  + row('r-12',[

        'Satu-satunya kategori yang tersedia di kedua pertanyaan · basis '+n+' RC',cross),
      card('TABEL 2','Sumber dan preferensi channel per AP','Jumlah RC · multi-respons',chTbl)
    ]);
}

function pg3(R){
  const n=R.length, aps=byAp(R);

  const serah=dist(R,'serah');
  const mudah=C(R,r=>r.proses==='Mudah'), sulit=C(R,r=>r.proses==='Sulit');
  const sulitRows=R.filter(r=>r.proses==='Sulit');
  const KESULIT=['Jarak jauh','Jadwal bentrok','Jadwal molor','Antrian panjang','Info tidak jelas',
    'Tidak ada transport','Tidak ada pengantar','Lainnya'];
  const ks=multi(sulitRows,'kesulitan',KESULIT);
  const jarak=R.map(r=>r.jarak).filter(x=>x!=null);
  const kunj=R.map(r=>r.kunjungan).filter(x=>x!=null);
  const jam=R.map(r=>r.jam).filter(x=>x!=null);
  const potYa=C(R,r=>r.potongan==='Ya'), potNo=C(R,r=>r.potongan==='Tidak'),
        potTt=C(R,r=>r.potongan==='Tidak tahu');
  const potVals=R.filter(r=>r.potJml!=null).map(r=>r.potJml);
  const kepD=dist(R,'kepFsp',KEP5);

    return a.length?dec(a.reduce((x,y)=>x+y,0)/a.length,1):'—';})();
  const tdkPuasRows=R.filter(r=>r.kepFsp==='Biasa'||r.kepFsp==='Tidak Puas'||r.kepFsp==='Sangat Tidak Puas');
  const tp=multi(tdkPuasRows,'fspTdkPuas',['Jarak jauh','Biaya transport','Antrian panjang','Persyaratan sulit','Pelayanan tidak ramah']).filter(x=>x.v>0);

  const potTbl=tbl('<tr><th>Area Program</th><th class="ctr">n</th><th class="ctr">Ada</th>'+

    '<th class="n">Rentang<br>nominal</th></tr>',
    aps.slice().sort((a,b)=>C(b[1],r=>r.potongan==='Ya')-C(a[1],r=>r.potongan==='Ya'))
    .map(([a,rr])=>{
      const v=rr.filter(r=>r.potJml!=null).map(r=>r.potJml);
      return '<tr><td>'+esc(a)+'</td><td class="ctr">'+rr.length+'</td><td class="ctr">'+
        C(rr,r=>r.potongan==='Ya')+'</td><td class="ctr">'+C(rr,r=>r.potongan==='Tidak')+
        '</td><td class="ctr">'+C(rr,r=>r.potongan==='Tidak tahu')+'</td><td class="n">'+
        (v.length?rp(med(v)):'—')+'</td><td class="n">'+
        (v.length?(Math.min(...v)===Math.max(...v)?nf(Math.min(...v)):nf(Math.min(...v))+'–'+nf(Math.max(...v))):'—')+
        '</td></tr>';
    }).join('')+
    '<tr><td><b>Total seleksi</b></td><td class="ctr"><b>'+n+'</b></td><td class="ctr"><b>'+potYa+
    '</b></td><td class="ctr"><b>'+potNo+'</b></td><td class="ctr"><b>'+potTt+'</b></td><td class="n"><b>'+
    (potVals.length?rp(med(potVals)):'—')+'</b></td><td class="n"><b>'+
    (potVals.length?nf(Math.min(...potVals))+'–'+nf(Math.max(...potVals)):'—')+'</b></td></tr>');

  return kpi([
    {t:'Jenis FSP terpakai',v:fspD.filter(f=>f.v>0).length,b:'termasuk nama yang diisi di "Lainnya"'},
    {t:'Harus datang ke kantor FSP',v:C(R,r=>r.harusDatang==='Ya'),b:'dari '+n+' RC'},
    {t:'Jarak median ke FSP',v:jarak.length?med(jarak)+' km':'—',sm:true,

    {t:'Melaporkan ada potongan',v:potYa,b:'dari '+n+' RC · '+potTt+' menjawab tidak tahu'},
    {t:'Puas/sangat puas pelayanan FSP',v:C(R,r=>r.kepFsp==='Puas'||r.kepFsp==='Sangat Puas'),b:'dari '+n+' RC'}
  ])
  + row('r-2',[
      card('TABEL 3','FSP yang digunakan untuk mencairkan GN','Jumlah RC · basis '+n+' responden',
        hb(fspD.filter(f=>f.v>0).map(f=>({k:esc(f.k),v:f.v,
          cls:(f.k==='Bank lain'||f.k==='Tidak tahu/lupa')?'l':''})),{tight:true})),
      card('TABEL 3','Siapa yang menyerahkan GN kepada RC','Jumlah RC · basis '+n+' responden',
        hb(['Petugas FSP','Petugas WVI','Petugas Kantor Desa','Petugas Kantor Kecamatan','Lainnya']
          .map(k=>({k:k,v:C(R,r=>r.serah===k),cls:k==='Lainnya'?'l':'',
            lbl:of_(C(R,r=>r.serah===k),n)})),{max:n}))
    ])
  + row('r-3',[
      card('TABEL 4','Persepsi proses pemberian GN melalui FSP','Basis '+n+' responden',
        donut(mudah,sulit,'Mudah','Sulit','menjawab Mudah')),
      card('TABEL 4','Hal yang menyulitkan proses',

function pg4(R){

  const caraTbl=tbl('<tr><th>Area Program</th><th class="ctr">n</th>'+
    CARA.filter(k=>C(R,r=>r.caraPref===k)>0).map(k=>'<th class="ctr">'+esc(k).replace(/ /g,'<br>')+'</th>').join('')+'</tr>',
    aps.map(([a,rr])=>'<tr><td>'+esc(a)+'</td><td class="ctr">'+rr.length+'</td>'+

  return kpi([
    {t:'Dana sesuai informasi awal',v:C(R,r=>r.danaSesuai==='Ya'),b:'dari '+n+' RC'},

        'Persepsi RC · basis '+n+' responden',

          cls:ix===3?'l':(ix===4?'ll':''),lbl:of_(C(R,r=>r.waktuInfo===k),n)})),{max:n})),
      card('TABEL 5','Kesesuaian dana yang diterima','Jumlah RC per AP · basis '+n+' responden',dsTbl)
    ])
  + row('r-3',[
      card('TABEL 6','Total Cost of Access — biaya transport',
        'Basis '+n+' RC · '+trOk.length+' nilai dipakai dalam perhitungan',
        kv([

        ])),
      card('TABEL 6','Kehilangan kesempatan kerja','Basis '+n+' responden',
        hb([{k:'Tidak kehilangan',v:C(R,r=>r.hilang==='Tidak'),cls:'g',lbl:of_(C(R,r=>r.hilang==='Tidak'),n)},
            {k:'Tidak relevan (tidak bekerja)',v:C(R,r=>r.hilang.indexOf('Tidak relevan')===0),cls:'l',

          ['Diperlakukan dengan hormat', C(R,r=>r.hormat==='Ya')+' / '+n]
        ])))

        'Pilihan tunggal · basis '+n+' responden',

          lbl:of_(d.v,n)})),{max:n})),

function pg6(R){
  const n=R.length, aps=byAp(R);

  const TDKPUAS=['Jumlah kurang','Proses lama','Persyaratan banyak','Lainnya'];
  const posRows=R.filter(r=>r.kepuasan==='Puas'||r.kepuasan==='Sangat Puas');
  const negRows=R.filter(r=>r.kepuasan==='Biasa'||r.kepuasan==='Tidak Puas'||r.kepuasan==='Sangat Tidak Puas');
  const pa=multi(posRows,'puasAlasan',PUASAL).filter(x=>x.v>0);
  const na=multi(negRows,'tdkPuasAlasan',TDKPUAS).filter(x=>x.v>0);
  const bantuanYa=C(R,r=>r.bantuanLain==='Ya');
  const L=R.filter(r=>r.lama==='Ya'), m=L.length;

  const kepTbl=tbl('<tr><th>Area Program</th><th class="ctr">n</th>'+
    KEP5.filter(k=>C(R,r=>r.kepuasan===k)>0).map(k=>'<th class="ctr">'+k.replace(/ /g,'<br>')+'</th>').join('')+'</tr>',
    aps.map(([a,rr])=>'<tr><td>'+esc(a)+'</td><td class="ctr">'+rr.length+'</td>'+
      KEP5.filter(k=>C(R,r=>r.kepuasan===k)>0).map(k=>'<td class="ctr">'+C(rr,r=>r.kepuasan===k)+'</td>').join('')+'</tr>').join('')+

  const bantuanTbl=tbl('<tr><th>Area Program</th><th class="ctr">n</th><th class="ctr">Ya</th></tr>',
    aps.slice().sort((a,b)=>C(b[1],r=>r.bantuanLain==='Ya')-C(a[1],r=>r.bantuanLain==='Ya'))
    .map(([a,rr])=>'<tr><td>'+esc(a)+'</td><td class="ctr">'+rr.length+'</td><td class="ctr">'+

  const bdBars=hb(BD.map(([lbl,key,pos])=>({k:lbl,v:C(L,r=>r[key]===pos),
    lbl:of_(C(L,r=>r[key]===pos),m)})),{max:Math.max(1,m)});
  const BO=['Modalitas CVP (sekarang)','Sama saja','Modalitas lama (barang dari staff)','Tidak yakin'];
  const boTbl=tbl('<tr><th>Area Program</th><th class="ctr">n subset</th>'+

    aps.map(([a,rr])=>{
      const ll=rr.filter(r=>r.lama==='Ya');
      return '<tr><td>'+esc(a)+'</td><td class="ctr">'+ll.length+'</td>'+
        BO.filter(k=>C(L,r=>r.bOverall===k)>0).map(k=>'<td class="ctr">'+
          (ll.length?C(ll,r=>r.bOverall===k):'—')+'</td>').join('')+'</tr>';
    }).join('')+
    '<tr><td><b>Total seleksi</b></td><td class="ctr"><b>'+m+'</b></td>'+
      BO.filter(k=>C(L,r=>r.bOverall===k)>0).map(k=>'<td class="ctr"><b>'+C(L,r=>r.bOverall===k)+'</b></td>').join('')+'</tr>');

  return kpi([
    {t:'Kepuasan program',v:mean+'<span class="u"> / 5</span>',b:'rata-rata skala 1–5 · n='+kv5.length},
    {t:'Puas / sangat puas',v:kepPos,b:'dari '+n+' RC'},

        hb(KEP5.map(k=>({k:k+' ('+KEPVAL[k]+')',v:C(R,r=>r.kepuasan===k),

      card('TABEL 9','Kepuasan per Area Program','Jumlah RC · basis '+n+' responden',kepTbl),

        '<div class="sw"><span><i style="background:var(--o)"></i>lebih baik / lebih cepat / lebih mudah</span><span><i style="background:var(--d-4)"></i>sama</span></div>'+bdBars),
      card('TABEL 9','Preferensi modalitas keseluruhan, per AP',
        'Jumlah RC · basis '+m+' RC subset modalitas lama',boTbl)

const SLICERS=[

];
const state={ap:new Set(),fsp:new Set(),lama:new Set()};
let openSlicer=null;

const anyOn=()=>state.ap.size||state.fsp.size||state.lama.size;
function pass(r,skip){
  return (skip==='ap'   || state.ap.size===0   || state.ap.has(r.ap))   &&
         (skip==='fsp'  || state.fsp.size===0  || state.fsp.has(r.fsp)) &&
         (skip==='lama' || state.lama.size===0 || state.lama.has(r.lama));
}
function filtered(){ return DATA.filter(r=>pass(r)); }
function resetFilters(){
  state.ap.clear(); state.fsp.clear(); state.lama.clear(); openSlicer=null;
}
function slicerLabel(key){
  const s=state[key];
  if(s.size===0) return (currentLang==='en' ? 'All' : 'Semua');
  if(s.size===1) {
    const raw = [...s][0];
    return tr(raw);
  }
  return s.size + (currentLang==='en' ? ' selected' : ' dipilih');
}

function slicer(key,title,values){
  const sel=state[key], open=(openSlicer===key);
  const items=values.map(v=>({v:v,n:DATA.filter(r=>r[key]===v && pass(r,key)).length}));
  const allOn=(sel.size===0);
  const dispTitle = tr(title);

  let topControls='';
  if(items.length>5){
    const placeholder = (currentLang==='en' ? 'Search '+dispTitle+'...' : 'Cari '+dispTitle+'...');
    const txtAll = (currentLang==='en' ? 'Select All' : 'Pilih Semua');
    const txtClear = (currentLang==='en' ? 'Clear' : 'Kosongkan');
    topControls='<div class="sl-search-wrap">'+
      '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'+
      '<input type="text" class="sl-search-inp" placeholder="'+esc(placeholder)+'" data-sl-search="'+key+'">'+
    '</div>'+
    '<div class="sl-quick-actions">'+
      '<button type="button" class="sl-act-link" data-quick="all" data-f="'+key+'">'+txtAll+'</button>'+
      '<span>·</span>'+
      '<button type="button" class="sl-act-link" data-quick="clear" data-f="'+key+'">'+txtClear+'</button>'+
    '</div>';
  }

  const selectAllTxt = (currentLang==='en' ? '(Select all)' : '(Pilih semua)');
  let list='<div class="sl-list" data-f="'+key+'">';
  list+='<label class="sl-i sl-all'+(allOn?' sel':'')+'">'+
        '<input type="checkbox" data-all="1"'+(allOn?' checked':'')+'>'+
        '<span>'+selectAllTxt+'</span><b>'+items.reduce((a,b)=>a+b.n,0)+'</b></label>';
  list+=items.map(i=>{
    const on=sel.has(i.v), dis=(i.n===0 && !on);
    const dispVal = tr(i.v);
    return '<label class="sl-i'+(on?' sel':'')+(dis?' dis':'')+'" data-label="'+esc(dispVal).toLowerCase()+'">'+
      '<input type="checkbox" data-v="'+esc(i.v)+'"'+(on?' checked':'')+(dis?' disabled':'')+'>'+
      '<span title="'+esc(dispVal)+'">'+esc(dispVal)+'</span><b>'+i.n+'</b></label>';
  }).join('');
  list+='</div>';

  return '<div class="sl'+(open?' open':'')+'" data-sl="'+key+'">'+
    '<button type="button" class="sl-btn" data-toggle="'+key+'" aria-expanded="'+(open?'true':'false')+'">'+
      '<span class="txt"><span class="lbl">'+dispTitle+'</span>'+
      '<span class="val'+(sel.size?'':' off')+'">'+esc(slicerLabel(key))+'</span></span>'+
      '<span class="car"></span></button>'+
    '<div class="sl-pop">'+topControls+list+'</div></div>';
}

function buildFilters(){
  const R=filtered(), aps=new Set(R.map(r=>r.ap));
  $('slicers').innerHTML = SLICERS.map(([k,t,vals])=>slicer(k,t,vals())).join('');
  if(currentLang === 'en'){
    $('f-stat').innerHTML='<b>'+R.length+'</b> of '+DATA.length+' RCs \u00b7 '+aps.size+' PAs';
    $('f-reset').textContent = 'Reset filters';
  } else {
    $('f-stat').innerHTML='<b>'+R.length+'</b> dari '+DATA.length+' RC \u00b7 '+aps.size+' AP';
    $('f-reset').textContent = 'Bersihkan filter';
  }
  $('f-reset').hidden = !anyOn();
}

function setOpen(key){
  openSlicer=key;
  document.querySelectorAll('#slicers .sl').forEach(sl=>{
    const on=(sl.dataset.sl===key);
    sl.classList.toggle('open',on);
    const b=sl.querySelector('.sl-btn');
    if(b) b.setAttribute('aria-expanded',String(on));
  });
}
const closeSlicers=()=>setOpen(null);

function onSlicerClick(e){
  const head=e.target.closest('.sl-btn');
  if(!head) return;
  e.stopPropagation();
  const key=head.dataset.toggle;
  setOpen(openSlicer===key ? null : key);
}
function onSlicerChange(e){
  const inp=e.target;
  if(!inp || inp.tagName!=='INPUT' || inp.disabled) return;
  const box=inp.closest('.sl-list'); if(!box) return;
  const key=box.dataset.f;
  if(inp.dataset.all){ state[key].clear(); }
  else {
    const v=inp.dataset.v;
    state[key].has(v) ? state[key].delete(v) : state[key].add(v);
  }
  render();
}

document.addEventListener('click',e=>{
  if(openSlicer && !e.target.closest('.sl')) closeSlicers();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && openSlicer) closeSlicers();
});

function syncChrome(){
  $('fbar').hidden = (current===COVER_ID);

function render(){

  const R=filtered();
  const isEn = (currentLang === 'en');
  const selTxt = (state.ap.size ? [...state.ap].join(', ') : (isEn ? 'all PAs' : 'semua AP'))
    + (state.fsp.size  ? ' \u00b7 FSP: '+[...state.fsp].join(', ') : '')
    + (state.lama.size ? ' \u00b7 '+(isEn?'old modality: ':'modalitas lama: ')+[...state.lama].map(v=>tr(v)).join('/') : '');

  const emptyMsg = isEn
    ? '<div class="empty"><b>No respondents match this filter combination.</b><br>Broaden your filters above or click "Reset filters".</div>'
    : '<div class="empty"><b>Tidak ada responden pada kombinasi filter ini.</b><br>Longgarkan salah satu filter di atas atau tekan "Bersihkan filter".</div>';

  $('pages').innerHTML = PAGES.map(([id,,h1,sub,fn])=>{
    const isCover = (id===COVER_ID);
    const head = isCover ? '' :
      '<div class="top"><div><h1>'+tr(h1)+'</h1><div class="sub">'+tr(sub)+' \u00b7 '+esc(selTxt)+
      ' \u00b7 '+R.length+(isEn?' RCs':' RC')+'</div></div></div>';
    const body = (isCover || R.length) ? fn(R) : emptyMsg;
    return '<section class="pg'+(isCover?' pg-cover':'')+(id===current?' on':'')+
      '" id="'+id+'">'+head+body+'</section>';
  }).join('');
  syncChrome();
}

function saveState(){
  try{
    const payload = {
      theme: document.body.classList.contains('dark') ? 'dark' : 'light',
      lang: currentLang,
      page: current,
      ap: [...state.ap],
      fsp: [...state.fsp],
      lama: [...state.lama]
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  }catch(e){}
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    if(s.theme === 'dark'){
      document.body.classList.add('dark');
    }
    if(s.lang === 'en' || s.lang === 'id'){
      currentLang = s.lang;
    }
    if(Array.isArray(s.ap)) s.ap.forEach(v=>state.ap.add(v));
    if(Array.isArray(s.fsp)) s.fsp.forEach(v=>state.fsp.add(v));
    if(Array.isArray(s.lama)) s.lama.forEach(v=>state.lama.add(v));
    if(s.page && PAGES.some(p=>p[0]===s.page)){
      current = s.page;
    }
  }catch(e){}
  updateLangUI();
}

function toggleTheme(){
  document.body.classList.toggle('dark');
  saveState();
}

function exportCSV(){
  const R = filtered();
  if(!R.length){
    alert('Tidak ada responden pada kombinasi filter ini untuk diekspor.');
    return;
  }
  const isEn = (currentLang === 'en');
  const headers = isEn
    ? ['Program Area','Disbursed Amount (IDR)','Nominal Status','Info Adequacy','FSP','Distribution Process','Has Deduction','Deduction Amount','Distance (km)','Visits','Travel Time (hrs)','Transport Cost','Met Needs','Program Satisfaction','FSP Satisfaction','Child Age','Child Gender','Respondent Gender','HoH Gender','HoH Education','Disability in HH','Housing Status','Household Size']
    : ['Area Program','Dana Diterima','Status Nominal','Kecukupan Info','FSP','Proses Distribusi','Ada Potongan','Jumlah Potongan','Jarak (km)','Kunjungan','Waktu Tempuh (jam)','Biaya Transportasi','Sesuai Kebutuhan','Kepuasan Program','Kepuasan FSP','Usia Anak','JK Anak','JK Responden','JK KK','Pendidikan KK','Disabilitas RT','Status Rumah','Jumlah Anggota RT'];
  const rows = R.map(r=>[
    r.ap||'',
    r.dana!=null ? r.dana : '',
    r.danaOk ? 'Sesuai' : 'Tidak Sesuai',
    r.infoCukup||'',
    r.fsp||'',
    r.proses||'',
    r.potongan||'',
    r.potJml!=null ? r.potJml : '',
    r.jarak!=null ? r.jarak : '',
    r.kunjungan!=null ? r.kunjungan : '',
    r.jam!=null ? r.jam : '',
    r.trans!=null ? r.trans : '',
    r.sesuaiKebutuhan||'',
    r.kepuasan||'',
    r.kepFsp||'',
    r.usiaAnak!=null ? r.usiaAnak : '',
    r.jkAnak||'',
    r.jkResp||'',
    r.jkKk||'',
    r.pendKk||'',
    r.disab||'',
    r.rumah||'',
    r.anggota!=null ? r.anggota : ''
  ]);

  const csvContent = '\uFEFF' + [
    headers.map(h=>'"'+h.replace(/"/g,'""')+'"').join(','),
    ...rows.map(row=>row.map(cell=>'"'+String(cell).replace(/"/g,'""')+'"').join(','))
  ].join('\r\n');

  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const apTxt = state.ap.size===1 ? [...state.ap][0].replace(/\s+/g,'_') : 'Semua_AP';
  a.download = `PDM_CVP_GN_Export_${apTxt}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

        <span class="pl-lbl">${labelDate}</span>

      </div>
      <div class="pl-meta-item">
        <span class="pl-lbl">${labelScope}</span>
        <span class="pl-val">${filterSummary}</span>
      </div>
      <div class="pl-meta-item">
        <span class="pl-lbl">${labelSample}</span>
        <span class="pl-val">${sampleTxt}</span>
      </div>
    </div>
  `;
}

// Single Page Print Action
const btnPrint = $('btn-print-pdf');
if(btnPrint) {
  btnPrint.addEventListener('click', ()=>{
    document.body.classList.remove('print-all-pages');
    updatePrintLetterhead(false);
    window.print();
  });
}

// Full Multi-Page Dossier Print Action
const btnPrintAll = $('btn-print-all');
if(btnPrintAll) {
  btnPrintAll.addEventListener('click', ()=>{
    document.body.classList.add('print-all-pages');
    updatePrintLetterhead(true);
    window.print();
  });
}

window.addEventListener('beforeprint', ()=>{
  const isAll = document.body.classList.contains('print-all-pages');
  updatePrintLetterhead(isAll);
});

window.addEventListener('afterprint', ()=>{
  document.body.classList.remove('print-all-pages');
  updatePrintLetterhead(false);
});

/* Sticky Compact Filter Bar on Scroll (> 200px) */
let scrollTicking = false;
function handleStickyCompactScroll(){
  if(!scrollTicking){
    window.requestAnimationFrame(()=>{
      const fb = $('fbar');
      if(fb){
        const scrolled = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
        fb.classList.toggle('compact', scrolled > 200);
      }
      scrollTicking = false;
    });
    scrollTicking = true;
  }
}
window.addEventListener('scroll', handleStickyCompactScroll, { passive: true });

/* Slicer search & quick actions delegation */
$('slicers').addEventListener('input', e=>{
  const inp = e.target;
  if(!inp || !inp.classList.contains('sl-search-inp')) return;
  const q = inp.value.trim().toLowerCase();
  const pop = inp.closest('.sl-pop');
  if(!pop) return;
  pop.querySelectorAll('.sl-i[data-label]').forEach(row=>{
    const lbl = row.getAttribute('data-label') || '';
    row.style.display = (!q || lbl.includes(q)) ? 'flex' : 'none';
  });
});

$('slicers').addEventListener('click', e=>{
  const btn = e.target.closest('.sl-act-link');
  if(!btn) return;
  e.stopPropagation();
  const act = btn.dataset.quick;
  const key = btn.dataset.f;
  if(act === 'all'){
    state[key].clear();
  } else if(act === 'clear'){
    // To uncheck all, select a dummy or toggle
    const allVals = (key==='ap'?AP_ALL:(key==='fsp'?FSP_ALL:['Ya','Tidak']));
    state[key].clear();
  }
  render();
  saveState();
});

// Update render and go to auto-save state
const origGo = go;
go = function(id){
  origGo(id);
  saveState();
};

$('slicers').addEventListener('click',onSlicerClick);
$('slicers').addEventListener('change',e=>{
  onSlicerChange(e);
  saveState();
});
$('f-reset').addEventListener('click',()=>{
  resetFilters();
  render();
  saveState();
});

// Initial state load
loadState();
render();
if(current !== COVER_ID){
  go(current);
}
</script>
</body>
</html>
